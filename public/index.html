<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaming Pulse | Portal Pro</title>
    <link rel="stylesheet" href="2videojuego.css">
</head>
<body>
    <header>
        <h1>🎮 GAMING PULSE NOTICIAS</h1>
    </header>

    <div class="grid-container">
        <aside id="sidebar">
            <div id="contact-section" class="card-glass">
                <h2>📩 Únete al Equipo</h2>
                <p style="font-size: 0.85rem; margin-bottom: 15px; color: #cbd5e1;">¿Quieres ser redactor? Déjanos tu correo y te daremos acceso.</p>
                <form id="contactForm">
                    <input type="email" id="contactEmail" placeholder="Tu correo electrónico" required>
                    <textarea id="contactMessage" placeholder="¿Sobre qué juegos quieres escribir?" rows="2" required></textarea>
                    <button type="submit" class="btn-neon">Solicitar Acceso</button>
                </form>
            </div>

            <div id="login-section" class="discreet-box">
                <h3>Acceso Interno</h3>
                <form id="loginForm">
                    <input type="text" id="username" placeholder="Usuario" class="input-sm" required>
                    <input type="password" id="password" placeholder="Contraseña" class="input-sm" required>
                    <button type="submit" class="btn-discreet">Ingresar</button>
                    <p id="loginError" style="display:none; color:#ef4444; font-size: 0.8rem; text-align: center; margin-top: 5px;">❌ Error</p>
                </form>
            </div>

            <div id="editor-section" class="card-glass" style="display: none;">
                <h2>✍️ Nuevo Post</h2>
                <form id="postForm">
                    <input type="text" id="postTitle" placeholder="Título de la noticia" required>
                    <textarea id="postContent" placeholder="Breve descripción..." rows="3" required></textarea>
                    <input type="url" id="postImg" placeholder="URL Imagen (https://...)" required>
                    <select id="postCategory">
                        <option value="Noticias">Noticias</option>
                        <option value="Reseñas">Reseñas</option>
                        <option value="Hardware">Hardware</option>
                    </select>
                    <button type="submit" class="btn-neon">Publicar</button>
                    <button type="button" onclick="logout()" class="btn-logout">Cerrar Sesión</button>
                </form>
            </div>
        </aside>

        <main id="news-feed">
            <div class="feed-header">
                <h2>📢 Publicaciones Recientes</h2>
                <select id="filterCategory" class="filter-select">
                    <option value="todos">Filtrar por categoría</option>
                    <option value="Noticias">Noticias</option>
                    <option value="Reseñas">Reseñas</option>
                    <option value="Hardware">Hardware</option>
                </select>
            </div>
            <div id="postsContainer" class="posts-grid"></div>
        </main>
    </div>

    <footer class="site-footer">
        <p>&copy; 2026 Gaming Pulse. Todos los derechos reservados.</p>
    </footer>

    <script src="3videojuego.js"></script>
</body>
</html>
